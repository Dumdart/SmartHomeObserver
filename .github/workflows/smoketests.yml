name: Smoke tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Set up Python 3.11
        run: |
          python -m pip install --upgrade uv
          uv python install 3.11
          uv venv --python 3.11

      - name: Install Linux GUI system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Build release wheel
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python_path=".venv/Scripts/python.exe"
          else
            python_path=".venv/bin/python"
          fi
          uv pip install --python "${python_path}" build
          "${python_path}" -m build --wheel

      - name: Verify clean wheel installation
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            python_path=".venv/Scripts/python.exe"
          else
            python_path=".venv/bin/python"
          fi
          "${python_path}" -m release.verify_distribution dist/*.whl
