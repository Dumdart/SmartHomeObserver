name: CI

on:
  push:
  pull_request:
  workflow_call:


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Verify release versions
        run: python -m release.run_ci
      - name: Set up Python 3.11
        run: |
          python -m pip install --upgrade uv
          uv python install 3.11
          uv venv --python 3.11
      - name: Install GUI system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install package and dependencies
        run: uv pip install --python .venv/bin/python -e ".[apps,test]"
      - name: Verify dashboard dependency contract
        run: .venv/bin/python -m pytest tests/test_dashboard_dependencies.py -q
      - name: Verify Codex plugin bundle
        run: .venv/bin/python -m pytest tests/test_plugin_bundle.py -q
      - name: Run tests
        run: .venv/bin/python -m pytest -n 4 --dist loadfile -q
