name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  smoketests:
    uses: ./.github/workflows/smoketests.yml

  release:
    runs-on: ubuntu-latest
    needs:
      - ci
      - smoketests
    permissions:
      id-token: write
      contents: write

    environment:
      name: pypi

    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m release.run_cd

      - name: Set up release tools
        run: python -m pip install --upgrade build uv

      - name: Build release distributions
        run: python -m build

      - name: Verify clean wheel installation
        run: python -m release.verify_distribution dist/*.whl

      - name: Publish release distributions to PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Install MCP Publisher
        run: |
          curl -L \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate MCP server metadata
        run: mcp-publisher validate server.json

      - name: Authenticate with MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: mcp-publisher publish server.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "TopicGate ${{ github.ref_name }}" \
            --generate-notes
