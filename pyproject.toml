[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topicgate"
version = "1.5.2"
description = "Secure local access to your MQTT topics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
  "mqtt",
  "iot",
  "mcp",
  "model-context-protocol",
  "ai-agent",
  "ai",
  "desktop",
  "windows",
  "automation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Topic :: Home Automation",
  "Topic :: Internet",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "paho-mqtt",
    "pyside6",
    "qasync",
    "sqlalchemy",
    "alembic",
    "keyring",
    "fastmcp==3.4.7",
]

[project.urls]
Repository = "https://github.com/Dumdart/TopicGate"
Documentation = "https://github.com/Dumdart/TopicGate/tree/main/docs"
"Issue Tracker" = "https://github.com/Dumdart/TopicGate/issues"
Changelog = "https://github.com/Dumdart/TopicGate/releases"

[project.optional-dependencies]
apps = [
    "fastmcp[apps]==3.4.7",
    "prefab-ui==0.20.2",
]
test = [
    "keyrings.alt",
    "pytest",
    "pytest-xdist",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
cache_dir = ".pytest_cache"
asyncio_mode = "auto"

[project.scripts]
topicgate = "topicgate.mcp.server:run"
topicgate-cli = "topicgate.cli.topicgate_cli:main"

[project.gui-scripts]
topicgate-gui = "topicgate.gui.app:run"



[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
topicgate = [
    "assets/*.png",
    "assets/*.svg",
    "assets/icons/*.svg",
    "infrastructure/database/alembic.ini",
    "infrastructure/database/alembic/*.py",
    "infrastructure/database/alembic/*.mako",
    "infrastructure/database/alembic/README",
    "infrastructure/database/alembic/versions/*.py",
    "infrastructure/diagnostic_packs/zigbee2mqtt/v1/*.json",
]
